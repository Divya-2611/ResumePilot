# =====================================================================
# AI Resume Optimizer - Backend Configuration
# All secrets are read from environment variables (12-factor style).
# See README for the full list of environment variables.
# =====================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resumepilot

  # -------------------- Datasource (Neon PostgreSQL 16) --------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resume_optimizer}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 120000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'update' for development; use Flyway/Liquibase for production migrations.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # -------------------- Email (Brevo) --------------------
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:465}               # 465 = implicit SSL (set 587 + MAIL_STARTTLS=true if switching)
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}          # Brevo SMTP key (MAIL_MODE=smtp only; API mode uses BREVO_API_KEY)
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL:true}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 30000
          timeout: 15000
          writetimeout: 15000

  # -------------------- Multipart upload limits --------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# -------------------- JWT configuration --------------------
app:
  jwt:
    # Use a 256-bit (32+ char) random secret in production.
    secret: ${JWT_SECRET:change-me-to-a-strong-random-256bit-secret-key}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    reset-token-expiration-ms: ${JWT_RESET_EXPIRATION_MS:600000}        # 10 minutes

  # -------------------- AI provider --------------------
  # Switch providers without touching code: OPENAI | GEMINI | CLAUDE
  ai:
    provider: ${AI_PROVIDER:OPENAI}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: https://api.openai.com/v1
      timeout-ms: 120000
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
      timeout-ms: 120000
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
      base-url: https://api.anthropic.com/v1
      timeout-ms: 120000

  # -------------------- File storage --------------------
  # mode: db  -> BLOBs in the database (default, survives restarts/redeploys)
  # mode: local -> files on disk under app.upload.dir (development only)
  storage:
    mode: ${STORAGE_MODE:db}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  # One-shot migration of legacy local-disk files into DB storage (set true once).
  migrate-local-files: ${MIGRATE_LOCAL_FILES:false}

  # -------------------- OTP --------------------
  otp:
    length: 6
    expiration-minutes: 5
    resend-cooldown-seconds: 60
    max-per-email-per-day: 10

  # -------------------- CORS --------------------
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000}

  # -------------------- Seeded admin --------------------
  # No hardcoded credentials - provide ADMIN_EMAIL / ADMIN_PASSWORD via env.
  # The seeder only creates the admin if it does not already exist.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    org.springframework.security: WARN
    com.resumepilot: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
